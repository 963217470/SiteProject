server {
    listen 80;
    server_name rd-studio.club;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/rd-studio.club/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://rd-studio.club$request_uri; }
}
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rd-studio.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rd-studio.club/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_name rd-studio.club;
    root /www/wwwroot/rd-studio.club/current;
    index index.html;
    access_log /www/wwwlogs/rd-studio.club.access.log;
    error_log /www/wwwlogs/rd-studio.club.error.log;
    client_max_body_size 100m;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/rd-studio.club/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri.html $uri/ =404; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ \.html$ { add_header Cache-Control "no-cache"; }
    location = /api-client.js { add_header Cache-Control "no-cache"; }
    location = /profile-page.js { add_header Cache-Control "no-cache"; }
    error_page 404 /404.html;
}
