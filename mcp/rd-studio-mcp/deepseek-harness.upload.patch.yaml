- insert:
    - id: mcp-rd-studio-upload
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rd_studio_upload
        transport: stdio
        command: node
        args: ['C:/replace-with/rd-studio-mcp/server.mjs']
        env:
          RD_STUDIO_URL: https://rd-studio.club
          RD_STUDIO_UPLOAD_TOKEN: !!js process.env.RD_STUDIO_UPLOAD_TOKEN
          RD_STUDIO_KNOWLEDGE_WRITE: '1'
          RD_STUDIO_NOTES_ROOT: !!js process.env.RD_STUDIO_NOTES_ROOT
        toolCallTimeoutMs: 300000
